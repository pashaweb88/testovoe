<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #notice { margin-top: 1rem; }
    #topic, #draft { margin: .75rem 0; }
    #draft-text { white-space: pre-wrap; margin: .25rem 0 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="notice" aria-live="polite"></p>
  <div id="topic" class="hidden">
    <strong>Тема:</strong> <span id="topic-text"></span>
  </div>
  <div id="draft" class="hidden">
    <strong>Черновик ответа:</strong>
    <p id="draft-text"></p>
  </div>
  <script type="module">
    const topicLabels = {
      delivery: "Доставка",
      pricing: "Цены",
      other: "Другое",
    };

    const form = document.querySelector("form");
    const notice = document.querySelector("#notice");
    const topicBlock = document.querySelector("#topic");
    const topicText = document.querySelector("#topic-text");
    const draftBlock = document.querySelector("#draft");
    const draftText = document.querySelector("#draft-text");

    function clearResult() {
      notice.textContent = "";
      topicText.textContent = "";
      draftText.textContent = "";
      topicBlock.classList.add("hidden");
      draftBlock.classList.add("hidden");
    }

    function showReady(topic, draft) {
      notice.textContent = "";
      topicText.textContent = topicLabels[topic] ?? topic;
      draftText.textContent = draft;
      topicBlock.classList.remove("hidden");
      draftBlock.classList.remove("hidden");
    }

    function showManualReview() {
      topicText.textContent = "";
      draftText.textContent = "";
      topicBlock.classList.add("hidden");
      draftBlock.classList.add("hidden");
      notice.textContent =
        "Не удалось автоматически разобрать заявку. Разберите её вручную и ответьте клиенту сами.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult();

      const reply = await fetch("/api/triage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: document.querySelector("#message").value }),
      });
      const data = await reply.json();

      if (data.status === "ready") {
        showReady(data.topic, data.draft);
        return;
      }

      if (data.status === "manual_review") {
        showManualReview();
        return;
      }

      if (data.status === "invalid_input") {
        notice.textContent = "Введите непустой текст заявки.";
        return;
      }

      notice.textContent = "Произошла ошибка. Попробуйте ещё раз.";
    });
  </script>
</body>
</html>
